name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  renderer:
    name: Motor de render (Python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: poster, POSTGRES_PASSWORD: poster, POSTGRES_DB: poster_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults: { run: { working-directory: services/renderer } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.17" }
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -q
        env: { TEST_DATABASE_URL: "postgres://poster:poster@localhost:5432/poster_test" }

  web:
    name: Web (typecheck, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poster/web typecheck
      - run: pnpm --filter @poster/web test
      - run: pnpm --filter @poster/web build

  e2e:
    name: E2E (tienda completa con datos sintéticos)
    runs-on: ubuntu-latest
    needs: [renderer, web]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: poster, POSTGRES_PASSWORD: poster, POSTGRES_DB: poster }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://poster:poster@localhost:5432/poster
      APP_SECRET: ci-secret-0123456789abcdef
      INTERNAL_API_SECRET: ci-internal
      ADMIN_PASSWORD: admin-local
      PUBLIC_BASE_URL: http://localhost:3000
      ALLOW_SIMULATED_CHECKOUT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: astral-sh/setup-uv@v6
        with: { version: "0.8.17" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @poster/web db:migrate && pnpm --filter @poster/web db:seed
      - run: pnpm --filter @poster/web build
      - name: Arrancar web y worker
        run: |
          mkdir -p data/files
          (cd apps/web && NODE_ENV=production nohup node_modules/.bin/next start > ../../web.log 2>&1 &)
          (cd services/renderer && uv sync --frozen --no-dev && \
            POSTER_DATA_PROVIDER=synthetic STORAGE_LOCAL_DIR=../../data/files WEB_INTERNAL_URL=http://localhost:3000 \
            nohup .venv/bin/posterengine-worker > ../../worker.log 2>&1 &)
          npx --yes wait-on -t 60000 http://localhost:3000/es
      - run: pnpm --filter @poster/web exec playwright install --with-deps chromium
      - run: pnpm --filter @poster/web test:e2e
      - if: failure()
        run: tail -n 100 web.log worker.log
